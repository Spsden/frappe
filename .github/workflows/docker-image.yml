name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install desktop dependencies
        working-directory: ./apps/desktop
        run: npm ci

      - name: Build desktop
        working-directory: ./apps/desktop
        run: npm run build

      - name: Build API Docker image
        run: docker build ./apps/api --file ./apps/api/Dockerfile --tag worktrace-api:ci
