name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxtst-dev \
            libxkbfile-dev \
            libxi-dev \
            libxrandr-dev \
            libgtk-3-dev \
            libnss3-dev \
            libasound2-dev \
            libxss1 \
            libsecret-1-dev

      - name: Install desktop dependencies
        working-directory: ./apps/desktop
        run: npm ci

      - name: Build desktop
        working-directory: ./apps/desktop
        run: npm run build

      - name: Build API Docker image
        run: docker build ./apps/api --file ./apps/api/Dockerfile --tag worktrace-api:ci
